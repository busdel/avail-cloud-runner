services:
  - type: web
    name: avail-ai
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./render/Dockerfile
    dockerContext: ./render
    healthCheckPath: /login
    autoDeploy: true
    envVars:
      - key: AVAIL_WEB_ROOT
        value: /app
      - key: AVAIL_ALLOW_SERVER_RUN
        value: "0"
      - key: AVAIL_PUBLIC_UPLOADS
        value: "0"
      - key: AVAIL_PUBLIC_DEMO
        value: "1"
      - key: AVAIL_ALLOW_DEMO_RUN
        value: "1"
      - key: AVAIL_META_MODELS
        value: "SimpleMean,WSimpleMean,ElasticNetLR,XGBoost"
      - key: AVAIL_MAX_UPLOAD_MB
        value: "256"
      - key: AVAIL_JOB_RETENTION_HOURS
        value: "24"
      - key: AVAIL_COOKIE_SECURE
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
