[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "avail-omics"
version = "1.5.0"
description = "AVAIL-omics: availability-aware multimodal integration for clinical cohorts with missing modalities."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Busranur Delice" }]
keywords = ["multimodal", "missing-modality", "microbiome", "neuroimaging",
            "parkinson", "machine-learning", "benchmark", "availability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

# Core = CPU-only. Every default install runs without GPU or CUDA toolchain.
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "scikit-learn>=1.0",
    "scipy>=1.7",
    "statsmodels>=0.13",
    "matplotlib>=3.5",
    "seaborn>=0.11",
    "openpyxl>=3.0",
    "networkx>=2.8",
    "xgboost>=1.7",
]

[project.optional-dependencies]
# Optional UMAP for the visualization toolkit; PCA fallback works without it.
viz = ["umap-learn>=0.5"]
# Neural (MLP/MoE/GNN/Transformer) and deep-tabular meta-learners.
deep = [
    "torch>=1.13",
    "pytorch-tabnet>=4.0",
    "tabpfn",
    "tabicl",
]
# Imaging adapter (NIfTI/DICOM -> Schaefer features).
imaging = [
    "nilearn>=0.10",
    "nibabel>=5.0",
]
# Optional TimesFM representation layer for the imaging adapter.
timesfm = ["timesfm"]
# Optional PyRadiomics block (Python <=3.12 recommended for the build).
radiomics = [
    "SimpleITK>=2.3",
    "pyradiomics>=3.0",
]
# SHAP-based biomarker interpretation.
bio = ["shap>=0.41"]
# Everything, for the full paper pipeline.
full = [
    "torch>=1.13",
    "pytorch-tabnet>=4.0",
    "tabpfn",
    "tabicl",
    "shap>=0.41",
    "nilearn>=0.10",
    "nibabel>=5.0",
]
dev = ["pytest", "jupyter", "nbformat"]

[project.scripts]
avail-omics = "avail_omics.cli:main"
avail = "avail_omics.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["avail_omics*", "avail_ai*"]
